minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 1440
shellEmulator: true

packages:
  - .demo
  - .app
  - layers/*
  - tairo-component-meta

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  better-sqlite3: false
  core-js-pure: false
  esbuild: false
  sharp: false
  vue-demi: false
