minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 1440
shellEmulator: true

packages:
  - .demo
  - .app
  - layers/*
  - tairo-component-meta

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  sharp: true
  vue-demi: true
