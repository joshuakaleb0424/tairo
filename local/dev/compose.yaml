name: tairo-dev

services:
  tairo:
    build:
      context: ../..
      dockerfile: local/dev/Dockerfile
    command:
      - sh
      - -c
      - pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 3000
    environment:
      NPM_TOKEN: "${NPM_TOKEN:-}"
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: "3000"
      PYTHON: /usr/bin/python3
    expose:
      - "3000"
    # healthcheck:
    #   test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/health"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 5
    #   start_period: 30s
    labels:
      caddy: "${TAIRO_FRONTEND_HOST:-tairo.localhost}"
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy_ingress_network: "${PROXY_NETWORK:-local-proxy}"
      traefik.enable: "true"
      traefik.docker.network: "${PROXY_NETWORK:-local-proxy}"
      traefik.http.routers.tairo.entrypoints: "${TRAEFIK_ENTRYPOINTS:-web}"
      traefik.http.routers.tairo.rule: "Host(`${TAIRO_FRONTEND_HOST:-tairo.localhost}`)"
      traefik.http.routers.tairo.tls: "${TRAEFIK_TLS:-false}"
      traefik.http.services.tairo.loadbalancer.server.port: "3000"
    networks:
      default: null
      proxy:
        aliases:
          - tairo
    restart: unless-stopped
    volumes:
      - ../..:/app

networks:
  default:
    name: tairo-dev
  proxy:
    external: true
    name: "${PROXY_NETWORK:-local-proxy}"
